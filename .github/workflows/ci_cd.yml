name: Senior Chatbot CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'senior_chatbot/**'
  pull_request:
    branches: [main]
    paths:
      - 'senior_chatbot/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  WORKING_DIR: senior_chatbot

jobs:
  # ─────────────────────────────────────────
  # Stage 1: Code Quality (Lint + Format)
  # ─────────────────────────────────────────
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-lint-

      - name: 📥 Install lint dependencies
        run: pip install flake8 black

      - name: 🔍 Run flake8
        run: flake8 src/ tests/ app.py --config .flake8

      - name: 🎨 Check black formatting
        run: black --check src/ tests/ app.py --config pyproject.toml

  # ─────────────────────────────────────────
  # Stage 2: Unit Tests
  # ─────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-test-

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🧪 Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ${{ env.WORKING_DIR }}/htmlcov/

  # ─────────────────────────────────────────
  # Stage 3: Build Docker Image
  # ─────────────────────────────────────────
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/senior-chatbot:latest
            ghcr.io/${{ github.repository }}/senior-chatbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # Stage 4: Deploy (Placeholder)
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy notification
        run: |
          echo "🎉 Deployment stage reached!"
          echo "Image: ghcr.io/${{ github.repository }}/senior-chatbot:${{ github.sha }}"
          echo ""
          echo "To deploy manually:"
          echo "  docker pull ghcr.io/${{ github.repository }}/senior-chatbot:latest"
          echo "  docker run -p 8501:8501 ghcr.io/${{ github.repository }}/senior-chatbot:latest"
